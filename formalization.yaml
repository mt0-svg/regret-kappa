version: "v0.4"

project:
  name: "regret-kappa"
  description: >-
    Online linear regression in dimension one, with the features revealed one at a time and no bound on them, and the
    regret measured against every linear predictor: for outcomes bounded by B and a horizon T >= 355713, both known
    to the learner, the minimax regret lies between B^2 (3 log T - 2 log log T - 15.2) and B^2 (3 log T + 0.37), so
    its leading constant is 3; the lower bound holds for randomized learners, with features in [0, 1]. A learner that
    knows neither B nor T has regret at most M^2 (3 log T + 4 log log (T + 2) + 12 + 2/sqrt T + 4/T) on every play of
    length T, with M the largest absolute outcome.
  authors: [mt0-svg]
  license: "Apache-2.0"

sources:
  - title: "Uniform regret bounds over R^d for the sequential linear regression problem with the square loss"
    authors: ["Pierre Gaillard et al."]
    id: "https://proceedings.mlr.press/v98/gaillard19a.html"
    type: article
    location: "Section 4.1: the open question on doubly uniform regret with features revealed on the fly (ALT 2019, PMLR 98; arXiv:1805.11386)"
    relationship: other
    note: "the question that the main theorem answers in dimension one; its constant 1 for features known in advance (their Theorems 4 and 7) is cited, not formalized"
    author_endorsement: not-contacted
  - title: "Self-Normalized Martingales and Uniform Regret Bounds for Linear Regression"
    authors: ["Fan Chen", "Jian Qian", "Alexander Rakhlin", "Nikita Zhivotovskiy"]
    id: "https://proceedings.mlr.press/v336/chen26f.html"
    type: article
    location: "Theorem 5 and Proposition 6: the doubly uniform regret is of order log T in dimension one (COLT 2026, PMLR 336; arXiv:2605.01628)"
    relationship: background
    author_endorsement: not-contacted
  - title: "The constant of doubly uniform regret in one-dimensional online linear regression is three"
    authors: [mt0-svg]
    id: "https://github.com/mt0-svg/regret-kappa"
    type: original-proof
    location: "paper/main.tex, Theorem 1.1, Theorems 3.1 and 4.1, Corollary 5.1, Remark 5.2 and Section 6"
    relationship: formalizes
    author_endorsement: n/a

