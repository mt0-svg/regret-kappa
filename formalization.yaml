fidelity:
  divergences: >-
    The minimax regret is an infimum over deterministic learners of suprema over plays, taken in the extended real
    numbers, and the expected regret of a randomized learner is the integral of the nonnegative regret plus the sum
    of the squared outcomes, minus that sum, in the extended real numbers (Section 5 of the paper). The upper bound
    and Section 6 work with Gamma/2 in place of Gamma, so with the increment 3/2, and with lambda/2 and A/2 in place
    of lambda and A; Proposition 6.4 is proved with the potential Psi_t + 2 log h; Lemma A.7 is proved from
    polynomial bounds on cosh with a remainder; in part (iv) of the proof of Lemma 4.6 the sum of log(i/k_0) is
    bounded through k_0^k_0/k_0! <= e^k_0 (Section 8 of the paper).

