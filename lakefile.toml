name = "regret-kappa"
version = "1.0.0"
description = "Online linear regression in dimension one with features revealed on the fly: the minimax regret is (3 + o(1)) B^2 log T, with an explicit learner and an explicit adversary and their constants, proved in Lean 4"
keywords = ["math", "online learning", "online linear regression", "minimax regret", "formal verification"]
license = "Apache-2.0"
licenseFiles = ["LICENSE", "NOTICE"]
preferReleaseBuild = true
releaseRepo = "https://github.com/mt0-svg/regret-kappa"
defaultTargets = ["Statement", "IndepStatement", "StatementCheck", "Upper", "Lower", "Kappa", "UpperSharp",
  "UpperSharpCheck", "Corollaries", "CorollariesIndep", "CorollariesCheck", "LowerSharp", "Main", "LowerSharpCheck",
  "Challenge", "Solution"]

[leanOptions]
pp.unicode.fun = true
relaxedAutoImplicit = false
autoImplicit = false

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.34.1"

# The model of Section 2 of the paper (learners, regret, minimax regret), the two halves of the limit and the limit.
[[lean_lib]]
name = "Statement"
roots = ["RegretKappa.Statement"]

# Two formalizations of the limit written separately (Section 7.2), under Lean's default options, which they were
# written with.
[[lean_lib]]
name = "IndepStatement"
roots = ["RegretKappa.StatementCheck.Indep", "RegretKappa.StatementCheck.Indep2"]
leanOptions = { autoImplicit = true, relaxedAutoImplicit = true }

# Their comparison with RegretKappa.Statement.
[[lean_lib]]
name = "StatementCheck"
roots = ["RegretKappa.StatementCheck.Equiv", "RegretKappa.StatementCheck.Equiv2"]

# The first formal proof of the limit, with cruder constants (Section 7.2): the upper half, the learner of
# Theorem 3.1 with the increment 120.
[[lean_lib]]
name = "Upper"
globs = ["RegretKappa.Upper.+"]

# The lower half, with a simpler adversary than that of Theorem 4.1.
[[lean_lib]]
name = "Lower"
globs = ["RegretKappa.Lower.+"]

# The limit from the two halves.
[[lean_lib]]
name = "Kappa"
roots = ["RegretKappa.Kappa"]

# Theorem 3.1 with its learner and constants (Section 3).
[[lean_lib]]
name = "UpperSharp"
globs = ["RegretKappa.UpperSharp.+"]

# A formal statement of Theorem 3.1 written separately, and its equivalence with RegretKappa/UpperSharp/Statement.lean.
[[lean_lib]]
name = "UpperSharpCheck"
globs = ["RegretKappa.UpperSharpCheck.+"]

# Randomized learners and bounded features: Corollary 5.1 and Remark 5.2, and the scaling of Lemma 2.1.
[[lean_lib]]
name = "Corollaries"
globs = ["RegretKappa.Corollaries.+"]

# Formalizations of Corollary 5.1 and Remark 5.2 written separately (Section 7.2), under Lean's default options.
[[lean_lib]]
name = "CorollariesIndep"
roots = ["RegretKappa.CorollariesCheck.Indep42a", "RegretKappa.CorollariesCheck.Indep42b",
  "RegretKappa.CorollariesCheck.Indep42c", "RegretKappa.CorollariesCheck.Indep51a",
  "RegretKappa.CorollariesCheck.Indep51b", "RegretKappa.CorollariesCheck.Indep51c",
  "RegretKappa.CorollariesCheck.Indep51u"]
leanOptions = { autoImplicit = true, relaxedAutoImplicit = true }

# Their comparison with RegretKappa/Corollaries/Statement.lean: equivalences, implications and refutations.
[[lean_lib]]
name = "CorollariesCheck"
roots = ["RegretKappa.CorollariesCheck.Junk", "RegretKappa.CorollariesCheck.Equiv42a",
  "RegretKappa.CorollariesCheck.Equiv42b", "RegretKappa.CorollariesCheck.Equiv51a",
  "RegretKappa.CorollariesCheck.Equiv51b", "RegretKappa.CorollariesCheck.Equiv42c",
  "RegretKappa.CorollariesCheck.Equiv51c", "RegretKappa.CorollariesCheck.Equiv51u"]

# Theorem 4.1 with its adversary and constants (Section 4), the drift certificate of Computation 4.4 included.
[[lean_lib]]
name = "LowerSharp"
globs = ["RegretKappa.LowerSharp.+"]

# Theorem 1.1 and Corollary 5.1 with their constants.
[[lean_lib]]
name = "Main"
roots = ["RegretKappa.MainStatement", "RegretKappa.Main"]

# A formal statement of Theorem 4.1, Theorem 1.1 and Corollary 5.1 written separately, and its comparison with
# RegretKappa/LowerSharp/Statement.lean and RegretKappa/MainStatement.lean.
[[lean_lib]]
name = "LowerSharpCheck"
globs = ["RegretKappa.LowerSharpCheck.+"]

# The statements with `sorry`, which nothing imports, and the module that proves them: the pair Comparator checks
# (config.json).
[[lean_lib]]
name = "Challenge"
globs = ["RegretKappa.Challenge", "RegretKappa.Challenge.+"]

[[lean_lib]]
name = "Solution"
roots = ["RegretKappa.Solution"]
